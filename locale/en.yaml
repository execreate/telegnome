hello: |-
    Hi, %s! 🍄 I'm Telegnome, a little gnome who keeps spam out of Telegram groups. Add me to your group and make me an admin, and I'll start guarding it.

something_went_wrong: |-
    Oops, I tripped over a mushroom 🍄 Something went wrong, please try again in a moment.

terms_and_conditions:
    button: |-
        Read the terms
    request: |-
        Before we start, please read my terms of use and accept them if you agree. The short version: I'm free, and you use me at your own risk.
    changed: |-
        My terms of use have changed. Please read the new version and accept it to keep using me.
    accepted: |-
        Thank you! 🌱 You're all set.
    failed_to_accept: |-
        I couldn't save your acceptance. Please try again.
