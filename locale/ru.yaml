hello: |-
    Привет, %s! 🍄 Я Telegnome, маленький гном, который защищает группы в Telegram от спама. Добавьте меня в свою группу и назначьте администратором, и я начну её охранять.

something_went_wrong: |-
    Ой, я споткнулся о мухомор 🍄 Что-то пошло не так, попробуйте ещё раз чуть позже.

terms_and_conditions:
    button: |-
        Прочитать условия
    request: |-
        Прежде чем начать, прочитайте, пожалуйста, мои условия использования и примите их, если согласны. Если коротко: я бесплатный, а пользуетесь вы мной на свой страх и риск.
    changed: |-
        Мои условия использования изменились. Пожалуйста, прочитайте новую версию и примите её, чтобы продолжить пользоваться ботом.
    accepted: |-
        Спасибо! 🌱 Всё готово.
    failed_to_accept: |-
        Не удалось сохранить ваше согласие. Пожалуйста, попробуйте ещё раз.
